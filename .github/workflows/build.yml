name: Build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          xcodebuild archive \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -archivePath ./Moonlight.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r Moonlight.xcarchive/Products/Applications/Moonlight.app Payload/
          zip -r Moonlight.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight
          path: Moonlight.ipa
